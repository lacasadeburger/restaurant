            text-transform: uppercase;
        }

        /* 4. IMAGE LCP : Accélération matérielle */
        .lcp-background {
            position: absolute !important; top: 0; left: 0; width: 100%; height: 520px;
            object-fit: cover; z-index: -1 !important; display: block;
            pointer-events: none; transform: translateZ(0);
            will-change: contents;
        }

        /* 5. STRUCTURE REACT */
  #root {

      /* On enlève position: relative et contain: paint */

        /* 6. CORRECTIF LISIBILITÉ SECTIONS */

            border-radius: 30px; padding: 20px 10px; contain: content;
        }

        #root, body { background-color: transparent !important; }

    <script>
        (function() {
            const root = document.getElementById('root');
            const fallback = document.getElementById('fallback-text');
            const observer = new MutationObserver(() => {
                if (root && root.hasChildNodes()) {
                    requestAnimationFrame(() => {
                        if (fallback) fallback.style.display = 'none';
                    });
                    observer.disconnect();
                }
            });
            if (root) observer.observe(root, { childList: true });
        })();
    </script>
