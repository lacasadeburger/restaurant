    <script>
        (function() {
            function initObserver() {
                var r = document.getElementById('root');
                var f = document.getElementById('fallback-text');
                if (!r) { setTimeout(initObserver, 20); return; }
                var observer = new MutationObserver(function(m, obs) {
                    if (r.hasChildNodes()) {
                        if (f) {
                            f.style.opacity = '0';
                            setTimeout(function() { if (f.parentNode) f.parentNode.removeChild(f); }, 400);
                        }
                        obs.disconnect();
                    }
                });
                observer.observe(r, { childList: true });
            }
            initObserver();
        })();
    </script>
