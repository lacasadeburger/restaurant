    <style>
        /* 1. POLICES LOCALES (Supprime l'alerte Tier et booste la vitesse) */
        @font-face {
            font-family: 'Ysabeau';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('/fonts/ysabeau-v5-latin-regular.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Ysabeau';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url('/fonts/ysabeau-v5-latin-700.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Sacramento';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('/fonts/sacramento-v15-latin-regular.woff2') format('woff2');
        }

        /* CSS Critique & Reset */
        *{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth;background-color:#000}
        body{background-color:#000;color:#fff;font-family:'Ysabeau',sans-serif;line-height:1.5;font-size:18px;max-width:100%;overflow-x:hidden}
        #root{min-height:100vh}

        /* OPTIMISATION LCP */
        .hero-container-lcp {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #000;
            contain: paint layout;
        }

        /* OPTIMISATION HEADER (CLS) */
        .header{
            background-color:#000;
            display:flex;
            justify-content:space-between;
            align-items:center;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:70px;
            z-index:9999;
            padding:0 20px;
            contain: size layout;
        }

        .menuBurgers{padding:100px 20px 40px;text-align:center}

        /* OPTIMISATION TITRE (CLS) */
        .menuBurgers h1 {
            font-size: 46px;
            margin-bottom: 20px;
            font-family: 'Sacramento', cursive;
            color: #ffcc00;
            min-height: 1.2em;
            line-height: 1.2;
        }

        /* OPTIMISATION GRILLE */
        .menu-items{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
            content-visibility:auto;
            contain-intrinsic-size: 1px 500px;
        }

        .responsive-image{
            max-width:100%;
            height:auto;
            border-radius:8px;
            display: block;
        }

        #order, .container-cards, section[id]{scroll-margin-top:100px!important}

        /* Footer */
        .footer{background-color:#111;color:white;padding:40px 0;text-align:center;border-top:1px solid #333}
        .footer-content{display:flex;flex-direction:column;align-items:center;gap:20px;max-width:1200px;margin:0 auto}
        .logoFooter{width:150px;height:auto;opacity:0.8}

        /* ANIMATION GPU */
        @keyframes pulse-cart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pulse-active {
            animation: pulse-cart 1.5s infinite ease-in-out;
            will-change: transform;
            contain: layout;
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        /* ANTI-CLS MOBILE */
        @media (max-width:768px){
            .menu-item{
                width:100%;
                max-width:350px;
                min-height: 400px;
            }
            .menuBurgers h1{font-size:38px}
        }
    </style>
