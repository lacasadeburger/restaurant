    <style>
        /* CSS Critique - Remplace le style.css supprimé */
        *{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth;background-color:#000}
        body{background-color:#000;color:#fff;font-family:'Ysabeau',sans-serif;line-height:1.5;font-size:18px;max-width:100%;overflow-x:hidden}
        #root{min-height:100vh}

        /* Layout Header & Menu */
        .header{background-color:#000;display:flex;justify-content:space-between;align-items:center;position:fixed;top:0;left:0;width:100%;height:70px;z-index:9999;padding:0 20px}
        .menuBurgers{padding:100px 20px 40px;text-align:center}
        .menuBurgers h1{font-size:46px;margin-bottom:20px;font-family:'Sacramento',cursive;color:#ffcc00}

        /* Grille & Images */
        .menu-items{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;content-visibility:auto;contain-intrinsic-size:1000px}
        .responsive-image{max-width:100%;height:auto;border-radius:8px}
        #order, .container-cards, section[id]{scroll-margin-top:100px!important}

        /* Footer */
        .footer{background-color:#111;color:white;padding:40px 0;text-align:center;border-top:1px solid #333}
        .footer-content{display:flex;flex-direction:column;align-items:center;gap:20px;max-width:1200px;margin:0 auto}
        .logoFooter{width:150px;height:auto;opacity:0.8}

        /* Animations */
        @keyframes pulse-cart{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
        .pulse-active{animation:pulse-cart 1.5s infinite ease-in-out}

        @media (max-width:768px){
            .menu-item{width:100%;max-width:350px}
            .menuBurgers h1{font-size:38px}
        }
    </style>
