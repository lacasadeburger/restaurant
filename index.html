<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://lacasadeburger.es">
    <link rel="preload" as="image" href="/burger-signature-torrevieja.webp" fetchpriority="high">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://lacasadeburger.es/" />

    <title>La Casa de Burger | Mejores Hamburguesas Gourmet de Torrevieja</title>
    <meta name="description" content="Descubre las mejores burgers gourmet y smash burgers en Torrevieja. Carne 100% artesanal, combos signature y recetas únicas." />

    <style>
        /* CSS Critique pour affichage instantané */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { background-color: #000 !important; color: #fff; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; overflow-x: hidden; }

        /* L'image fixe en fond qui assure le LCP */
        .lcp-background {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 520px !important;
            object-fit: cover !important;
            z-index: 1 !important;
            aspect-ratio: 1/1;
            transform: translateZ(0);
        }

        /* Texte d'attente (Skeleton) placé par-dessus l'image */
        #fallback-text {
            position: absolute;
            top: 100px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.4s ease;
        }

        #fallback-text h1 {
            font-size: clamp(2rem, 8vw, 3rem);
            font-weight: 950;
            text-transform: uppercase;
            line-height: 1.1;
            max-width: 90%;
            text-shadow: 2px 2px 25px rgba(0,0,0,1);
        }

        /* Le root React est au-dessus de tout une fois chargé */
        #root { position: relative; z-index: 10; }
    </style>

    <link rel="icon" type="image/webp" href="/logo.webp" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "La Casa de Burger",
      "image": "https://lacasadeburger.es/burger-signature-torrevieja.webp",
      "telephone": "+34602597210",
      "address": {
          "@type": "PostalAddress",
          "streetAddress": "AV. Diego Ramirez Pastor, 142",
          "addressLocality": "Torrevieja",
          "postalCode": "03181",
          "addressCountry": "ES"
      },
      "aggregateRating": { "@type": "AggregateRating", "ratingValue": "4.9", "reviewCount": "250", "bestRating": "5", "worstRating": "1" },
      "hasMenu": {
        "@type": "Menu",
        "name": "Carta La Casa de Burger",
        "hasMenuSection": [
          {
            "@type": "MenuSection",
            "name": "Burgers & Combos",
            "hasMenuItem": [
              {"@type":"MenuItem","name":"Combo Signature 1","offers":{"@type":"Offer","price":"18.00","priceCurrency":"EUR"}},
              {"@type":"MenuItem","name":"La Francesa Signature","offers":{"@type":"Offer","price":"12.00","priceCurrency":"EUR"}},
              {"@type":"MenuItem","name":"La Marroqui Signature","offers":{"@type":"Offer","price":"12.00","priceCurrency":"EUR"}},
              {"@type":"MenuItem","name":"La Smash Doble","offers":{"@type":"Offer","price":"13.00","priceCurrency":"EUR"}},
              {"@type":"MenuItem","name":"La Italiana Gourmet","offers":{"@type":"Offer","price":"13.00","priceCurrency":"EUR"}},
              {"@type":"MenuItem","name":"La Española Signature","offers":{"@type":"Offer","price":"14.00","priceCurrency":"EUR"}},
              {"@type":"MenuItem","name":"La Colombiana Signature","offers":{"@type":"Offer","price":"14.00","priceCurrency":"EUR"}},
              {"@type":"MenuItem","name":"La Mexicana Signature","offers":{"@type":"Offer","price":"14.00","priceCurrency":"EUR"}},
              {"@type":"MenuItem","name":"La India Gourmet","offers":{"@type":"Offer","price":"9.00","priceCurrency":"EUR"}},
              {"@type":"MenuItem","name":"La Auvergna Signature","offers":{"@type":"Offer","price":"12.00","priceCurrency":"EUR"}},
              {"@type":"MenuItem","name":"Patatas Bravas Casa","offers":{"@type":"Offer","price":"5.50","priceCurrency":"EUR"}},
              {"@type":"MenuItem","name":"Fritas Cheddar & Bacon","offers":{"@type":"Offer","price":"8.50","priceCurrency":"EUR"}},
              {"@type":"MenuItem","name":"Nuggets Artesanos","offers":{"@type":"Offer","price":"6.00","priceCurrency":"EUR"}},
              {"@type":"MenuItem","name":"Waffle XXL Nutella","offers":{"@type":"Offer","price":"7.00","priceCurrency":"EUR"}}
            ]
          }
        ]
      }
    }
    </script>
</head>
<body>
    <img src="/burger-signature-torrevieja.webp" alt="BEST BURGER TORREVIEJA" fetchpriority="high" loading="eager" decoding="sync" class="lcp-background">

    <div id="fallback-text">
        <h1>LA MEJOR HAMBURGUESA & BURGER GOURMET 2026<br>EN TORREVIEJA</h1>
        <h2 style="font-size:1.2rem;color:#FFD700;font-weight:700;margin-top:10px;text-transform:uppercase">BEST BURGER & SMASH BURGER & RECETAS UNICAS & THE CHAMPIONS BURGER 2026 TORREVIEJA</h2>
    </div>

    <div id="root"></div>

    <script>
        // Logique de transition sécurisée entre le HTML statique et React
        (function() {
            function initObserver() {
                const r = document.getElementById('root');
                const f = document.getElementById('fallback-text');

                if (!r) {
                    setTimeout(initObserver, 20);
                    return;
                }

                const observer = new MutationObserver((mutations, obs) => {
                    if (r.hasChildNodes()) {
                        if (f) {
                            f.style.opacity = '0';
                            setTimeout(() => f.remove(), 400);
                        }
                        obs.disconnect();
                    }
                });

                observer.observe(r, { childList: true });
            }
            initObserver();
        })();
    </script>

    <script type="module" src="/src/main.jsx" defer></script>
</body>
</html>
