          /* 3. IMAGE DE FOND (LCP) */
          .lcp-background {
              position: absolute !important;
              top: 80px !important;
              left: 0 !important;
              width: 100% !important;
              height: 500px !important;
              object-fit: cover !important;
              object-position: center bottom !important;
              z-index: 1 !important;
              display: block !important;
              pointer-events: none;
              contain: paint;
              transform: translateZ(0); /* Force le GPU */
              mask-image: linear-gradient(to bottom, black 75%, transparent 100%);
              -webkit-mask-image: linear-gradient(to bottom, black 75%, transparent 100%);
              filter: brightness(0.85) contrast(1.1);
          }

          @media (min-width: 1024px) {
              .lcp-background {
                  height: 800px !important;
                  object-position: center bottom !important;
              }
          }

          /* 4. FALLBACK TEXT */
          #fallback-text {
              position: absolute;
              top: 130px;
              left: 0;
              width: 100%;
              text-align: center;
              z-index: 3;
              pointer-events: none;
              transition: opacity 0.3s ease;
          }
          #fallback-text h1 {
              font-size: clamp(2.2rem, 10vw, 3.8rem); font-weight: 900;
              text-transform: uppercase;
              text-shadow: 2px 2px 25px rgba(0,0,0,1);
              line-height: 1.1;
          }
          #fallback-text h2 {

              text-shadow: 1px 1px 10px rgba(0,0,0,1); margin-top: 10px;
              text-transform: uppercase;
          }
      </style>

    <div id="root"></div>

    <script>
        (function() {
            const root = document.getElementById('root');
            const fallback = document.getElementById('fallback-text');
            const observer = new MutationObserver(() => {
                if (root && root.hasChildNodes()) {
                    if (fallback) {
                        fallback.style.opacity = '0';
                        setTimeout(() => fallback.remove(), 350);
                    }
                    observer.disconnect();
                }
            });
            if (root) observer.observe(root, { childList: true });
        })();
    </script>
