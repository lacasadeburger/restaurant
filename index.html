    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Ysabeau',sans-serif}
        body{font-size:24px;line-height:1.5;background-color:#000;color:#fff}
        html{scroll-behavior:smooth}

        .header{background-color:#000;display:flex;justify-content:space-between;align-items:center;position:fixed;top:0;left:0;width:100%;height:70px;z-index:9999}
        .logo{max-width:200px;height:auto}.nav-left,.nav-right{display:flex;align-items:center;margin:0 20px}

        .menuBurgers{padding:40px;text-align:center}
        .menuBurgers h1{font-size:46px;margin-bottom:20px;font-family:'Sacramento',cursive}
        .menu-items{display:flex;flex-wrap:wrap;justify-content:center}
        .menu-item{width:350px;height:500px;margin:10px;padding:1px}
        .menu-item img{display:flex;max-width:100%;height:250px}

        .card-inner{position:relative;transform-style:preserve-3d;transition:transform 0.6s}
        .front,.back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:25px;background-size:cover}
        .front{transform:rotateY(0deg);background-image:url("/assets/bg-c.jpg")}
        .back{transform:rotateY(180deg);background-image:url("/assets/bg-c1.jpg");backdrop-filter:blur(250px)}
        .card.reversed .card-inner{transform:rotateY(180deg)}

        @keyframes liquidGold{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
        .add-btn-gold{width:100%;background:linear-gradient(135deg,#BF953F 0%,#FCF6BA 25%,#D4AF37 50%,#FBF5B7 75%,#BF953F 100%);background-size:300% 300%;animation:liquidGold 6s ease infinite;color:#000;border:2.5px solid #000;padding:14px;font-weight:950;text-transform:uppercase;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
        .add-btn-gold.success{background:#2ed573!important;color:#fff!important;justify-content:center;animation:none!important}

        .footer{background-color:#333;color:#fff;padding:20px 0;text-align:center}
        .footer-content{display:flex;flex-direction:column;align-items:center;gap:20px;max-width:1200px;margin:0 auto}

        #order,.container-cards,section[id]{scroll-margin-top:160px!important}
        .pulse-active{animation:pulse-cart 1.5s infinite ease-in-out}
        @keyframes pulse-cart{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
    </style>
