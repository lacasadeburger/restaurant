      },
      {
        "@type": "MenuSection",
        "name": "Extras",
        "hasMenuItem": [
          {"@name": "Nuggets"}, {"@name": "Croquetas"}, {"@name": "Fritas"}, {"@name": "Waffle XXL"}
        ]
      }
    ]
  }
}
</script>
</head>
